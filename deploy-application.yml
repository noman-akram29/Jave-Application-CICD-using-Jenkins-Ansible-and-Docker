---
- hosts: development-servers
  become: true
  tasks:
    - name: Install python pip
      apt:
        name: python3-pip
        state: present

    - name: Install docker
      apt:
        name: docker.io
        state: present

    - name: Start docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install docker python module
      apt:
        name: python3-docker
        state: present

    - name: Start Application Container
      docker_container:
        name: Java-Test-Application
        image: "nomanakram29/test-java-application:${DOCKER_TAG}"
        state: started
        published_ports:
          - "0.0.0.0:8080:8080"
        restart_policy: unless-stopped