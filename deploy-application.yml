---
- hosts: developement-servers
  become: true
  tasks:
  - name: Install python pip
    apt:
      name: python-pip
      state: present
  - name: Install docker
      apt:
        name: docker
        state: present
  - name: start docker
    service:
      name: docker
      state: started
      enabled: yes
  - name: Install docker-py python module
    pip:
      name: docker-py
      state: present
  - name: Start Application Container
    docker_container:
      name: Java-Test-Application
      image: "nomanakram29/test-java-application:${DOCKER_TAG}"
      state: started
      published_ports:
        - 0.0.0.0:8080:8080